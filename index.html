<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="style.css">
	<title>NBA Latent Space</title>
	<script type="importmap">
	{
	  "imports": {
		"three": "https://cdn.jsdelivr.net/npm/three@v0.186.0/build/three.module.js",
		"three/addons/": "https://cdn.jsdelivr.net/npm/three@v0.186.0/examples/jsm/"
	  }
	}
	</script>
</head>
<body>
	<header class="title-card">
		<span class="tag">2026 Datathon</span>
		<h1>NBA 2025-26 Player Latent Space</h1>
		<p class="people">Adam, Joe, Jonathan, Rio</p>
	</header>

	<main class="viewer">
		<div class="stack">
			<div class="stage">
				<canvas class="webgl"></canvas>
			</div>
			<div id="player-data-card" hidden="true"></div>
		</div>
		<aside class="controls">
			<button id="view-toggle">Switch to 3D</button>

			<h2>Axes <span class="hint" id="pick-hint">pick two</span></h2>
			<ul id="axis-list"></ul>
			<h2>Colour <select id="color-by"></select></h2>
			<div id="color-legend"></div>

			<h2>Scale <label class="hint"><input type="checkbox" id="stretch" checked> stretch by importance</label></h2>
			<p class="note" id="scale-note"></p>
		</aside>
	</main>

	<section class="below">
		<h2>More here</h2>
		<p>Room for more thingies</p>
	</section>

	<script src="main.js" type="module"></script>
</body>
</html>
